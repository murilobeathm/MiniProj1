<html lang="pt">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ===================== CSS ===================== -->
  <style>
    :root {
      --bg: #f6f7fb;
      --surface: #ffffff;
      --text: #1f2430;
      --muted: #5d6475;
      --primary: #2f6fed;
      --primary-dark: #1e4fb8;
      --border: #e2e5ee;
      --shadow: 0 6px 24px rgba(20, 30, 60, .08);
      --radius: 14px;
      --header-h: 64px;
    }
    [data-theme="dark"] {
      --bg: #12151c;
      --surface: #1b2029;
      --text: #e8ebf2;
      --muted: #a0a8b8;
      --primary: #6a9bff;
      --primary-dark: #4a7fee;
      --border: #2b3240;
      --shadow: 0 6px 24px rgba(0, 0, 0, .35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background .3s, color .3s;
    }
    a { color: var(--primary); }
    img { max-width: 100%; display: block; }

    /* ---------- Cabeçalho / Navegação ---------- */
    header {
      position: sticky; top: 0; z-index: 50;
      height: var(--header-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow);
    }
    .nav {
      max-width: 1100px; height: 100%;
      margin: 0 auto; padding: 0 16px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .logo {
      font-weight: 700; font-size: 1.2rem;
      text-decoration: none; color: var(--text);
    }
    .logo span { color: var(--primary); }
    .nav-links { display: flex; gap: 4px; list-style: none; }
    .nav-links a {
      display: block; padding: 8px 14px; border-radius: 8px;
      text-decoration: none; color: var(--muted); font-weight: 500;
      transition: background .2s, color .2s;
    }
    .nav-links a:hover { background: var(--bg); color: var(--text); }
    .nav-links a.active { background: var(--primary); color: #fff; }
    .nav-actions { display: flex; gap: 6px; }
    .icon-btn {
      background: none; border: 1px solid var(--border); color: var(--text);
      width: 40px; height: 40px; border-radius: 8px; cursor: pointer;
      font-size: 1.1rem; display: grid; place-items: center;
    }
    .icon-btn:hover { background: var(--bg); }
    .menu-toggle { display: none; }
    #app { min-height: 100vh; display: flex; flex-direction: column; }

    /* ---------- Conteúdo / Secções (páginas da SPA) ---------- */
    main {
      flex: 1;
      width: 100%; max-width: 1100px;
      margin: 0 auto; padding: 40px 16px;
    }
    .page { animation: fadeIn .4s ease; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: none; }
    }
    h1 { font-size: clamp(2rem, 5vw, 3rem); line-height: 1.15; }
    h2 { font-size: 1.9rem; margin-bottom: 8px; }
    h3 { font-size: 1.15rem; margin-bottom: 6px; }
    .subtitle { color: var(--muted); margin-bottom: 28px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
    }
    .grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
    .btn {
      display: inline-block; padding: 12px 22px; border-radius: 10px;
      background: var(--primary); color: #fff; text-decoration: none;
      font-weight: 600; border: none; cursor: pointer; font-size: 1rem;
      transition: background .2s, transform .2s;
    }
    .btn:hover { background: var(--primary-dark); transform: translateY(-2px); }
    .btn.block { width: 100%; margin-top: 16px; text-align: center; }
    .btn.outline { background: transparent; color: var(--primary); border: 2px solid var(--primary); }
    .btn.outline:hover { background: var(--primary); color: #fff; }

    /* Início */
    .hero {
      display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 40px;
      min-height: 60vh;
    }
    .hero p { color: var(--muted); font-size: 1.15rem; margin: 16px 0 28px; max-width: 560px; }
    .hero p.hello { margin: 0; color: var(--primary); font-weight: 600; font-size: 1rem; }
    .hero p.role { margin: 6px 0 0; font-size: 1.25rem; color: var(--text); font-weight: 600; }
    .hero .actions { display: flex; flex-wrap: wrap; gap: 12px; }
    .avatar {
      width: 240px; height: 240px; border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), #9b5cff);
      display: grid; place-items: center;
      color: #fff; font-size: 5rem; font-weight: 700;
      box-shadow: var(--shadow);
    }

    /* Quem sou eu */
    .about { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
    .about p + p { margin-top: 12px; }
    .facts { list-style: none; }
    .facts li { padding: 10px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; gap: 10px; }
    .facts li:last-child { border-bottom: none; }
    .facts strong { color: var(--muted); font-weight: 500; }
    .timeline { margin-top: 20px; border-left: 3px solid var(--primary); padding-left: 20px; }
    .timeline-item { position: relative; margin-bottom: 20px; }
    .timeline-item::before {
      content: ""; position: absolute; left: -28px; top: 6px;
      width: 13px; height: 13px; border-radius: 50%;
      background: var(--surface); border: 3px solid var(--primary);
    }
    .timeline-item .date { font-size: .9rem; color: var(--primary); font-weight: 600; }

    /* O que faço */
    .service-icon { font-size: 2rem; margin-bottom: 10px; }
    .skills { margin-top: 28px; }
    .skill-groups { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); margin-top: 12px; }
    .skill-group h4 { font-size: .95rem; color: var(--muted); font-weight: 600; margin-bottom: 8px; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; }
    .tags li {
      padding: 4px 10px; border-radius: 999px; font-size: .85rem;
      background: var(--bg); border: 1px solid var(--border);
    }
    .timeline-item .company { color: var(--muted); font-size: .95rem; }
    .timeline-item ul { margin: 6px 0 0 18px; color: var(--muted); }
    .timeline-item ul li { margin-bottom: 2px; }
    .section-title { margin-top: 28px; }

    /* Hobbies */
    .hobby { cursor: pointer; transition: transform .2s; text-align: left; font: inherit; color: inherit; width: 100%; }
    .hobby:hover { transform: translateY(-4px); }
    .hobby .emoji { font-size: 2.6rem; }
    .hobby small { color: var(--primary); font-weight: 600; }

    /* ---------- Janela modal ---------- */
    .modal {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(10, 14, 25, .6);
      display: none; align-items: center; justify-content: center;
      padding: 16px;
    }
    .modal.open { display: flex; animation: fadeIn .25s ease; }
    .modal-box {
      background: var(--surface); color: var(--text);
      border-radius: var(--radius); padding: 28px;
      width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto;
      position: relative;
    }
    .modal-emoji { font-size: 3rem; }
    .modal-close { position: absolute; top: 12px; right: 12px; }
    .modal-box p { color: var(--muted); margin-top: 8px; }
    form { display: grid; gap: 12px; margin-top: 16px; }
    label { font-size: .9rem; font-weight: 600; }
    input, textarea {
      width: 100%; padding: 10px 12px; margin-top: 4px;
      border: 1px solid var(--border); border-radius: 8px;
      background: var(--bg); color: var(--text); font: inherit;
    }
    input:focus, textarea:focus { outline: 2px solid var(--primary); border-color: transparent; }
    .form-msg { color: #1a9b55; font-weight: 600; display: none; }

    /* ---------- Rodapé / identidade virtual ---------- */
    footer {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 28px 16px;
      text-align: center;
    }
    .social { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; list-style: none; margin-bottom: 14px; }
    .social a {
      width: 44px; height: 44px; border-radius: 50%;
      display: grid; place-items: center;
      background: var(--bg); color: var(--muted);
      border: 1px solid var(--border);
      transition: background .2s, color .2s, transform .2s;
    }
    .social a:hover { color: #fff; transform: translateY(-3px); }
    .social a.facebook:hover  { background: #1877f2; }
    .social a.x:hover         { background: #000; }
    .social a.linkedin:hover  { background: #0a66c2; }
    .social a.github:hover    { background: #333; }
    .social a.instagram:hover { background: #e1306c; }
    .social a.youtube:hover   { background: #ff0000; }
    .social svg { width: 20px; height: 20px; }
    footer p { color: var(--muted); font-size: .9rem; }

    /* ---------- Responsivo ---------- */
    @media (max-width: 800px) {
      .menu-toggle { display: grid; }
      .nav-links {
        position: absolute; top: var(--header-h); left: 0; right: 0;
        flex-direction: column; padding: 10px 16px;
        background: var(--surface); border-bottom: 1px solid var(--border);
        display: none;
      }
      .nav-links.open { display: flex; }
      .hero { grid-template-columns: 1fr; text-align: center; }
      .hero p { margin-left: auto; margin-right: auto; }
      .hero .actions { justify-content: center; }
      .avatar { width: 160px; height: 160px; font-size: 3.5rem; margin: 0 auto; grid-row: 1; }
      .about { grid-template-columns: 1fr; }
    }
  </style>
</head>

              <h3 class="section-title">Formação</h3>
              <div class="timeline">
                <div class="timeline-item" v-for="f in cv.formacao" :key="f.curso">
                  <span class="date">{{ f.data }}</span>
                  <h3>{{ f.curso }}</h3>
                  <span class="company">{{ f.escola }}</span>
                </div>
              </div>
            </div>

            <aside class="card">
              <h3>Dados pessoais</h3>
              <ul class="facts">
                <li v-for="d in cv.dados" :key="d.k"><strong>{{ d.k }}</strong> <span>{{ d.v }}</span></li>
              </ul>

              <h3 class="section-title">Idiomas</h3>
              <ul class="facts">
                <li v-for="l in cv.idiomas" :key="l.k"><strong>{{ l.k }}</strong> <span>{{ l.v }}</span></li>
              </ul>

              <h3 class="section-title">Certificações</h3>
              <ul class="facts">
                <li v-for="c in cv.certificacoes" :key="c"><span>{{ c }}</span></li>
              </ul>
              <button class="btn block" @click="ui.abrirContacto()">Enviar mensagem</button>
            </aside>
          </div>
        </section>`
    };

    const OQueFacoPage = {
      setup: () => ({ cv }),
      template: `
        <section class="page">
          <h2>O que faço?</h2>
          <p class="subtitle">As áreas em que trabalho e as competências que utilizo no dia a dia.</p>

          <div class="grid">
            <article class="card" v-for="s in cv.servicos" :key="s.titulo">
              <div class="service-icon">{{ s.icon }}</div>
              <h3>{{ s.titulo }}</h3>
              <p>{{ s.texto }}</p>
            </article>
          </div>

          <div class="card skills">
            <h3>Competências técnicas</h3>
            <div class="skill-groups">
              <div class="skill-group" v-for="g in cv.competencias" :key="g.grupo">
                <h4>{{ g.grupo }}</h4>
                <ul class="tags"><li v-for="item in g.itens" :key="item">{{ item }}</li></ul>
              </div>
            </div>
          </div>
        </section>`
    };

    const HobbiesPage = {
      setup: () => ({ cv, ui }),
      template: `
        <section class="page">
          <h2>Hobbies</h2>
          <p class="subtitle">O que gosto de fazer nos tempos livres. Clique num cartão para saber mais.</p>

          <div class="grid">
            <button class="card hobby" v-for="h in cv.hobbies" :key="h.id" @click="ui.abrirHobby(h)">
              <div class="emoji">{{ h.emoji }}</div>
              <h3>{{ h.titulo }}</h3>
              <p>{{ h.resumo }}</p>
              <small>Saber mais →</small>
            </button>
          </div>
        </section>`
    };

    /* =========================================================
       COMPONENTES — ESTRUTURA E JANELAS MODAIS
       ========================================================= */
    const AppHeader = {
      props: ['theme'],
      emits: ['toggle-theme'],
      setup() {
        const menuAberto = ref(false);
        const route = useRoute();
        // fecha o menu móvel sempre que se muda de página
        watch(() => route.path, () => { menuAberto.value = false; });
        const links = [
          { to: '/', label: 'Início' },
          { to: '/quem-sou', label: 'Quem Sou Eu?' },
          { to: '/o-que-faco', label: 'O que faço?' },
          { to: '/hobbies', label: 'Hobbies' }
        ];
        return { menuAberto, links };
      },
      template: `
        <header>
          <nav class="nav" aria-label="Navegação principal">
            <router-link to="/" class="logo">Murilo<span>.</span>CV</router-link>
            <ul class="nav-links" :class="{ open: menuAberto }">
              <li v-for="l in links" :key="l.to"><router-link :to="l.to">{{ l.label }}</router-link></li>
            </ul>
            <div class="nav-actions">
              <button class="icon-btn" @click="$emit('toggle-theme')"
                      aria-label="Alternar tema claro/escuro" title="Alternar tema">{{ theme === 'dark' ? '☀️' : '🌙' }}</button>
              <button class="icon-btn menu-toggle" @click="menuAberto = !menuAberto"
                      aria-label="Abrir menu" :aria-expanded="String(menuAberto)">☰</button>
            </div>
          </nav>
        </header>`
    };

    // Janela modal genérica: o conteúdo é passado por slot
    const ModalBox = {
      props: ['titleId'],
      emits: ['close'],
      setup() {
        const closeBtn = ref(null);
        onMounted(() => nextTick(() => closeBtn.value && closeBtn.value.focus()));
        return { closeBtn };
      },
      template: `
        <div class="modal open" role="dialog" aria-modal="true" :aria-labelledby="titleId" @click.self="$emit('close')">
          <div class="modal-box">
            <button ref="closeBtn" class="icon-btn modal-close" @click="$emit('close')" aria-label="Fechar">✕</button>
            <slot></slot>
          </div>
        </div>`
    };

    const ContactForm = {
      emits: ['done'],
      setup(props, { emit }) {
        const form = reactive({ nome: '', email: '', mensagem: '' });
        const enviado = ref(false);
        const formEl = ref(null);
        function submeter() {
          if (!formEl.value.checkValidity()) { formEl.value.reportValidity(); return; }
          enviado.value = true;
          Object.assign(form, { nome: '', email: '', mensagem: '' });
          setTimeout(() => emit('done'), 2000);
        }
        return { form, enviado, formEl, submeter };
      },
      template: `
        <form ref="formEl" novalidate @submit.prevent="submeter">
          <label>Nome <input type="text" v-model.trim="form.nome" required></label>
          <label>Email <input type="email" v-model.trim="form.email" required></label>
          <label>Mensagem <textarea rows="4" v-model.trim="form.mensagem" required></textarea></label>
          <button type="submit" class="btn">Enviar</button>
          <p class="form-msg" v-if="enviado">Obrigado! A sua mensagem foi registada.</p>
        </form>`
    };

    const AppFooter = {
      setup: () => ({ redes: cv.redes, ano: new Date().getFullYear() }),
      template: `
        <footer>
          <ul class="social" aria-label="Redes sociais">
            <li v-for="r in redes" :key="r.classe">
              <a :class="r.classe" :href="r.url" target="_blank" rel="noopener" :aria-label="r.nome" :title="r.nome">
                <svg :viewBox="r.viewBox" v-html="r.svg"></svg>
              </a>
            </li>
          </ul>
          <p>&copy; {{ ano }} Murilo Beathm · Mini Projeto SPA (VueJS) · Desenvolvimento Web</p>
        </footer>`
    };

    /* =========================================================
       ROUTER — navegação por links internos (#/...)
       ========================================================= */
    const router = createRouter({
      history: createWebHashHistory(),   // funciona a abrir o ficheiro diretamente (file://)
      linkExactActiveClass: 'active',
      routes: [
        { path: '/',           component: InicioPage,   meta: { title: 'Início' } },
        { path: '/quem-sou',   component: QuemSouPage,  meta: { title: 'Quem Sou Eu?' } },
        { path: '/o-que-faco', component: OQueFacoPage, meta: { title: 'O que faço?' } },
        { path: '/hobbies',    component: HobbiesPage,  meta: { title: 'Hobbies' } },
        { path: '/:pathMatch(.*)*', redirect: '/' }
      ],
      scrollBehavior: () => ({ top: 0 })
    });
    router.afterEach(to => { document.title = 'Murilo Beathm | ' + to.meta.title; });

    /* =========================================================
       COMPONENTE RAIZ
       ========================================================= */
    const App = {
      components: { AppHeader, AppFooter, ModalBox, ContactForm },
      setup() {
        // Tema claro / escuro
        let guardado = null;
        try { guardado = localStorage.getItem('theme'); } catch (e) {}
        const theme = ref(guardado || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
        watch(theme, t => {
          document.documentElement.setAttribute('data-theme', t);
          try { localStorage.setItem('theme', t); } catch (e) {}
        }, { immediate: true });
        const toggleTheme = () => { theme.value = theme.value === 'dark' ? 'light' : 'dark'; };

        // Bloqueia o scroll da página quando há um modal aberto
        let ultimoFoco = null;
        watch(() => ui.modal, (aberto, anterior) => {
          document.body.style.overflow = aberto ? 'hidden' : '';
          if (aberto && !anterior) ultimoFoco = document.activeElement;
          if (!aberto && ultimoFoco) ultimoFoco.focus();
        });

        // Tecla Escape fecha o modal
        const onKey = e => { if (e.key === 'Escape') ui.fechar(); };
        onMounted(() => document.addEventListener('keydown', onKey));
        onBeforeUnmount(() => document.removeEventListener('keydown', onKey));

        return { theme, toggleTheme, ui };
      },
      template: `
        <app-header :theme="theme" @toggle-theme="toggleTheme"></app-header>

        <main>
          <router-view></router-view>
        </main>

        <modal-box v-if="ui.modal === 'contacto'" title-id="contactTitle" @close="ui.fechar()">
          <h2 id="contactTitle">Contacte-me</h2>
          <p>Preencha o formulário e responderei assim que possível.</p>
          <contact-form @done="ui.fechar()"></contact-form>
        </modal-box>

        <modal-box v-if="ui.modal === 'hobby'" title-id="hobbyTitle" @close="ui.fechar()">
          <div class="emoji modal-emoji">{{ ui.hobby.emoji }}</div>
          <h2 id="hobbyTitle">{{ ui.hobby.titulo }}</h2>
          <p>{{ ui.hobby.texto }}</p>
        </modal-box>

        <app-footer></app-footer>`
    };

    createApp(App).use(router).mount('#app');
  </script>
</body>
</html>
